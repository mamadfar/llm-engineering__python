[project]
name = "llm-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad", email = "m.sabah.farhadi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.55.1",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
llm-engineering = "llm_engineering:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "jupyter>=1.1.1",
]
